apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-cicd
  labels:
    app: library-cicd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-cicd
  template:
    metadata:
      labels:
        app: library-cicd
    spec:
      containers:
        - name: library-cicd
          image: image-registry.openshift-image-registry.svc:5000/PROJECT_NAMESPACE/library-cicd:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
