name: Python CI

on:
  push:
    branches:
      - main
    paths:
      - "Library-CI-CD/**"
      - ".github/workflows/workflow.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Library-CI-CD/**"
      - ".github/workflows/workflow.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Library-CI-CD
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run flake8
        run: flake8 app.py tests sitecustomize.py

      - name: Run nose tests
        env:
          PYTHONPATH: .
        run: python -m nose -v tests.test_app
